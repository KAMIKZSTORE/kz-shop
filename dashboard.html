<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dashboard — PT AETHER ID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <style>
    /* ============ CUSTOM FONT: KING JACK STYLE ============ */
    @font-face {
      font-family: 'King Jack Style';
      src: url('/assets/fonts/KingJackStyle.ttf') format('truetype'),
           url('/assets/fonts/KingJackStyle.woff2') format('woff2'),
           url('/assets/fonts/KingJackStyle.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --font: 'Outfit', system-ui, -apple-system, sans-serif;
      --display: 'Sora', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --radius: 24px; --radius-sm: 16px; --radius-lg: 32px;
      --transition: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      
      --bg: #030712; 
      --surface: rgba(255, 255, 255, 0.03);
      --surface-hover: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(0, 242, 255, 0.4);
      --text: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.75);
      --text-muted: rgba(255, 255, 255, 0.45);
      
      --primary: #00f2ff;
      --primary-hover: #00d2ff;
      --primary-soft: rgba(0, 242, 255, 0.08);
      --primary-glow: rgba(0, 242, 255, 0.4);
      
      --success: #00ff9d;
      --success-soft: rgba(0, 255, 157, 0.1);
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.1);
      --danger: #ff0055;
      --danger-soft: rgba(255, 0, 85, 0.1);
      
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.6);
      --glass-bg: rgba(255, 255, 255, 0.02);
      --glass-blur: 35px;
      
      --safe-area-top: env(safe-area-inset-top, 0px);
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh; min-height: 100dvh;
      line-height: 1.5;
      overflow-x: hidden;
      position: relative;
      width: 100%;
      overscroll-behavior: none;
      letter-spacing: 0.01em;
    }
    
    /* VIDEO BACKGROUND */
    .bg-video-wrap {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
      z-index: 0; overflow: hidden;
      background: linear-gradient(135deg, #030712, #001a2c, #002233, #030712);
      background-size: 400% 400%;
      animation: bgGradientShift 15s ease infinite;
    }
    @keyframes bgGradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .bg-video-wrap video {
      width: 100%; height: 100%; object-fit: cover; opacity: 0.35; pointer-events: none;
    }

    /* OVERLAY VIGNETTE */
    .bg-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
      background: radial-gradient(circle at center, transparent 0%, rgba(3, 7, 18, 0.7) 80%, rgba(3, 7, 18, 0.95) 100%);
      z-index: 1; pointer-events: none;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; touch-action: manipulation; }
    ::selection { background: var(--primary-soft); color: var(--primary); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }

    .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; min-height: 100dvh; position: relative; z-index: 2; }

    /* SIDEBAR */
    .sidebar {
      background: #050709; /* 100% Solid hitam pekat */
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      padding: 24px 16px; padding-top: calc(24px + var(--safe-area-top));
      position: sticky; top: 0; height: 100vh; height: 100dvh;
      display: flex; flex-direction: column; gap: 4px;
      transition: transform 0.3s ease; z-index: 50; box-shadow: 4px 0 32px rgba(0,0,0,0.6);
    }
    .sidebar::after {
      content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 1px;
      background: linear-gradient(180deg, transparent, rgba(0, 242, 255, 0.3), transparent);
      pointer-events: none;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 8px 12px; margin-bottom: 16px; }
    .brand-logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #0084ff);
      display: grid; place-items: center;
      font-family: var(--display); font-weight: 700; color: #000; font-size: 1.1rem;
      box-shadow: 0 4px 12px var(--primary-glow);
    }
    .brand-text { font-family: var(--display); font-weight: 700; font-size: 1.1rem; letter-spacing: -0.02em; color: #fff; }
    .brand-text span { color: var(--primary); }

    /* SIDEBAR THUMBNAIL */
    .sidebar-thumb {
      width: 100%; height: 140px; border-radius: var(--radius-sm); overflow: hidden;
      margin-bottom: 16px; position: relative; padding: 2px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), 0 0 20px rgba(0, 242, 255, 0.1);
    }
    .sidebar-thumb::before {
      content: ''; position: absolute; top: 50%; left: 50%; width: 200%; height: 200%;
      transform: translate(-50%, -50%);
      background: conic-gradient(from 0deg, #00f2ff, #0084ff, #00ff9d, #00f2ff);
      animation: spin-border 4s linear infinite;
      z-index: 0;
    }
    .sidebar-thumb::after {
      content: ''; position: absolute; inset: 2px; border-radius: calc(var(--radius-sm) - 2px);
      background: linear-gradient(to top, rgba(5, 7, 9, 0.9), transparent 70%);
      z-index: 2; pointer-events: none;
    }
    .sidebar-thumb img {
      position: absolute; inset: 2px; width: calc(100% - 4px); height: calc(100% - 4px);
      object-fit: cover; transition: transform 0.5s ease; border-radius: calc(var(--radius-sm) - 2px);
      z-index: 1;
    }
    .sidebar-thumb:hover img { transform: scale(1.05); }
    @keyframes spin-border {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .nav-section { font-size: 0.68rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.15em; padding: 12px 12px 6px; font-family: var(--display); }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius-sm);
      color: var(--text-secondary); font-size: 0.9rem; font-weight: 500;
      transition: all var(--transition-smooth); border: 1px solid transparent; position: relative;
    }
    .nav-item:hover { background: var(--surface-hover); color: var(--text); }
    .nav-item.active { background: var(--primary-soft); color: var(--primary); border-color: rgba(0, 242, 255, 0.2); }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 20px; background: var(--primary); border-radius: 0 4px 4px 0; box-shadow: 0 0 8px var(--primary-glow); }
    .nav-icon { width: 18px; height: 18px; flex-shrink: 0; }
    .nav-divider { height: 1px; background: var(--border); margin: 12px 4px; }

    .main { display: flex; flex-direction: column; min-width: 0; position: relative; z-index: 10; }

    /* TOPBAR */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px; padding-top: calc(16px + var(--safe-area-top));
      border-bottom: 1px solid var(--border); background: rgba(5, 7, 9, 0.85); 
      backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
      position: sticky; top: 0; z-index: 30; gap: 12px;
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .topbar-left h1 {
      font-family: 'King Jack Style', 'Sora', sans-serif;
      font-size: 2rem; font-weight: normal; letter-spacing: 0.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      background: linear-gradient(135deg, #ffffff 0%, #00f2ff 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
    }
    .topbar-left p { color: var(--text-muted); font-size: 0.85rem; margin-top: 2px; display: none; font-weight: 400; }
    .topbar-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .user-badge {
      display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px;
      border-radius: 30px; background: var(--surface); border: 1px solid var(--border);
      transition: all var(--transition-smooth); cursor: pointer;
    }
    .user-badge:hover { border-color: var(--border-strong); box-shadow: 0 0 12px var(--primary-soft); }
    .user-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #0084ff);
      display: grid; place-items: center; color: #000; font-weight: 700; font-size: 0.85rem;
      font-family: var(--display);
    }
    .user-email { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .content { padding: 32px; padding-bottom: calc(32px + var(--safe-area-bottom)); display: flex; flex-direction: column; gap: 24px; max-width: 1280px; width: 100%; margin: 0 auto; }

    /* CARD PREMIUM */
    .card {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(35px) saturate(180%); -webkit-backdrop-filter: blur(35px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.06); border-radius: var(--radius);
      padding: 24px; transition: all var(--transition-smooth);
      animation: fadeInUp 0.5s ease backwards; position: relative; 
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      pointer-events: none;
    }
    .card:hover { border-color: rgba(0, 242, 255, 0.15); }

    /* KARTU THUMBNAIL VIDEO */
    .thumbnail-card {
      padding: 0;
      overflow: hidden;
      height: 240px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 30px rgba(0, 242, 255, 0.1);
    }
    .video-thumbnail-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .thumb-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      filter: contrast(1.1) brightness(0.8) saturate(1.2);
    }
    .thumb-scanline {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 242, 255, 0.03) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 2;
    }
    .thumb-scanline::after {
      content: '';
      position: absolute;
      top: -50%; left: 0; width: 100%; height: 50%;
      background: linear-gradient(to bottom, transparent, rgba(0, 242, 255, 0.1), transparent);
      animation: scan-move 4s linear infinite;
    }
    @keyframes scan-move {
      0% { top: -50%; }
      100% { top: 150%; }
    }
    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(3, 7, 18, 0.95) 0%, rgba(3, 7, 18, 0.3) 50%, transparent 100%);
      pointer-events: none;
      z-index: 3;
    }
    .thumb-text {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-family: 'King Jack Style', 'Sora', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 0 10px rgba(0, 242, 255, 0.8), 0 0 20px rgba(0, 242, 255, 0.4);
      animation: badge-pulse 2s ease-in-out infinite;
    }
    @keyframes badge-pulse {
      0%, 100% { text-shadow: 0 0 10px rgba(0,242,255,0.8), 0 0 20px rgba(0,242,255,0.4); }
      50% { text-shadow: 0 0 15px rgba(0,242,255,1), 0 0 30px rgba(0,242,255,0.6); }
    }
    .badge-dot {
      width: 8px; height: 8px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--success);
      animation: dot-blink 1s infinite;
    }
    @keyframes dot-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* STATS GRID */
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .stat-card { 
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(35px) saturate(180%); -webkit-backdrop-filter: blur(35px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.06); border-radius: var(--radius);
      padding: 22px; transition: all var(--transition-smooth); position: relative; overflow: hidden; 
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .stat-card:hover { transform: translateY(-3px); border-color: var(--border-strong); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 20px var(--primary-soft); }
    .stat-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 14px; }
    .stat-icon svg { width: 22px; height: 22px; filter: drop-shadow(0 0 4px currentColor); }
    
    .stat-card:nth-child(1) .stat-icon { background: var(--primary-soft); color: var(--primary); }
    .stat-card:nth-child(2) .stat-icon { background: var(--success-soft); color: var(--success); }

    .stat-value { font-size: 1.65rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; font-family: var(--mono); transition: color 0.3s ease; color: #fff; }
    .stat-label { color: var(--text-muted); font-size: 0.82rem; font-weight: 500; margin-top: 4px; }

    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .card-title { font-family: var(--display); font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; color: #fff; }
    .card-title svg { width: 18px; height: 18px; color: var(--primary); filter: drop-shadow(0 0 4px var(--primary-glow)); }

    /* BUTTONS & ACTIONS ROW */
    .actions-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 12px; border-radius: var(--radius-sm); font-family: var(--display); font-size: 0.85rem; font-weight: 600; transition: all var(--transition-smooth); border: 1px solid transparent; white-space: nowrap; width: 100%; }
    .btn-primary { background: linear-gradient(135deg, var(--primary), #0084ff); color: #000; box-shadow: 0 4px 14px var(--primary-glow); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--primary-glow); filter: brightness(1.1); }
    .btn-outline { background: rgba(255, 255, 255, 0.03); border-color: var(--border-strong); color: var(--text); }
    .btn-outline:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); transform: translateY(-2px); }

    /* TOAST */
    .toast { position: fixed; bottom: 24px; right: 24px; left: 24px; padding: 14px 20px; background: rgba(5, 7, 9, 0.95); backdrop-filter: blur(24px) saturate(180%); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); font-size: 0.875rem; font-weight: 500; z-index: 300; animation: slideIn 0.3s ease; display: flex; align-items: center; gap: 10px; color: #fff; max-width: calc(100vw - 48px); margin: 0 auto; }
    .toast.error { border-left: 3px solid var(--danger); color: var(--danger); }
    .toast.success { border-left: 3px solid var(--success); color: var(--success); }
    @keyframes slideIn { from { transform: translateY(120%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeInUp 0.5s ease backwards; }
    .stat-card:nth-child(1) { animation: fadeInUp 0.4s ease 0.05s backwards; } 
    .stat-card:nth-child(2) { animation: fadeInUp 0.4s ease 0.1s backwards; }

    /* MOBILE */
    .menu-toggle { display: none; width: 44px; height: 44px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); place-items: center; color: var(--text); flex-shrink: 0; }
    .overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 40; 
      backdrop-filter: blur(16px) saturate(180%); -webkit-backdrop-filter: blur(16px) saturate(180%);
      opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .overlay.active { opacity: 1; visibility: visible; }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: fixed; left: 0; top: 0; width: 280px; transform: translateX(-100%); z-index: 50; }
      .sidebar.open { transform: translateX(0); }
      .menu-toggle { display: grid; }
      .user-email { display: none; }
      .content { padding: 20px; padding-bottom: calc(20px + var(--safe-area-bottom)); }
      .topbar { padding: 16px 20px; padding-top: calc(16px + var(--safe-area-top)); }
      .topbar-left h1 { font-size: 1.5rem; }
      .thumb-text { font-size: 1rem; bottom: 10px; left: 10px; }
      .actions-row { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <script>
    // ============ [1] FIX VIDEO BACKGROUND AUTOPLAY ============
    const videos = document.querySelectorAll('video');
    function attemptPlay() {
      videos.forEach(v => {
        v.muted = true;
        v.play().catch(e => {
          console.log("Autoplay diblokir, menunggu interaksi layar pertama...", e);
          const tryPlay = () => { v.play().catch(err => console.log(err)); };
          document.addEventListener('click', tryPlay, { once: true });
          document.addEventListener('touchstart', tryPlay, { once: true });
          document.addEventListener('scroll', tryPlay, { once: true });
        });
      });
    }
    videos.forEach(v => {
      v.addEventListener('canplay', attemptPlay);
      v.addEventListener('canplaythrough', attemptPlay);
      v.addEventListener('loadedmetadata', attemptPlay);
    });
    attemptPlay(); 

    // ============ UI HELPERS ============
    function toggleSidebar() { 
      document.getElementById('sidebar').classList.toggle('open'); 
      document.getElementById('overlay').classList.toggle('active'); 
    }
    if (typeof toast === 'undefined') { window.toast = function(msg, type = 'info') { const t = document.createElement('div'); t.className = `toast ${type}`; t.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>${msg}`; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }; }

    // ============ FALLBACKS (PENCEGAHAN STUCK LOADING) ============
    if (typeof ensureUserProfile === 'undefined') {
      window.ensureUserProfile = async (user) => {
        const snap = await db.ref('users/' + user.uid).once('value');
        return snap.val() || { plan: 'trial', role: 'user', status: 'active' };
      };
    }
    if (typeof isAdminEmail === 'undefined') {
      window.isAdminEmail = (email) => email === 'admin@kaze.cloud';
    }
    if (typeof getPlanLabel === 'undefined') {
      window.getPlanLabel = (plan) => plan ? plan.charAt(0).toUpperCase() + plan.slice(1) : 'Unknown';
    }
    if (typeof getPlanFeatureAccess === 'undefined') {
      window.getPlanFeatureAccess = (plan) => {
        if (plan === 'pro') return ['autoTyping', 'autoRecord', 'wlcm', 'antispam', 'autosahur', 'anticall', 'selfmode'];
        if (plan === 'basic') return ['autoTyping', 'wlcm', 'antispam', 'anticall'];
        if (plan === 'trial') return ['autoTyping', 'wlcm'];
        return [];
      };
    }

    // ============ REAL-TIME DASHBOARD LOGIC ============
    auth.onAuthStateChanged(async user => {
      if (!user) return window.location.href = '/client/login.html';
      if (!user.emailVerified) return window.location.href = '/client/login.html';

      // Update UI Awal
      document.getElementById('userAvatar').textContent = user.email[0].toUpperCase();
      document.getElementById('userEmail').textContent = user.email;

      // Ambil data user & cek paket 
      let currentPlan = 'trial';
      let currentSettings = {};

      try {
        const profile = await ensureUserProfile(user);
        if (profile.role === 'admin' || isAdminEmail(user.email)) return window.location.href = '/admin/dashboard.html';
        if (profile.status === 'banned') { toast('Akun Anda dibanned', 'error'); return window.location.href = '/client/login.html'; }
        if (!profile.plan) return window.location.href = '/client/plans.html';

        currentPlan = profile.plan;
        document.getElementById('botStatus').textContent = getPlanLabel(currentPlan);

        function renderFeatureCount() {
          const fs = getPlanFeatureAccess(currentPlan);
          const act = fs.filter(f => currentSettings[f]).length;
          document.getElementById('featureCount').textContent = `${act}/${fs.length}`;
        }

        // Real-time Profile Listener
        db.ref('users/' + user.uid).on('value', (snap) => {
          const p = snap.val();
          if (!p) return;
          if (p.status === 'banned') { toast('Akun Anda dibanned', 'error'); window.location.href = '/client/login.html'; return; }
          if (!p.plan) { window.location.href = '/client/plans.html'; return; }
          currentPlan = p.plan;
          document.getElementById('botStatus').textContent = getPlanLabel(p.plan);
          renderFeatureCount();
        });

        // Real-time Settings Listener
        db.ref('settings').on('value', (snap) => {
          currentSettings = snap.val() || {};
          renderFeatureCount();
        });
      } catch (e) {
        console.error('Error loading profile:', e);
      }
    });
  </script>
